# Packages the chart in this repo and publishes it twice, with the same bytes, on a release tag
# (krateo-blueprints/charts PUBLISHING.md):
#   1. to GHCR, as oci://ghcr.io/krateo-blueprints/charts/<name>:<tag>, by this workflow;
#   2. to the helm index the portal Marketplace installs from
#      (https://krateo-blueprints.github.io/charts/blueprints/index.yaml), by the organisation's publisher,
#      krateo-blueprints/charts/.github/workflows/publish-chart.yaml (pinned below).
#
# The chart carries a LITERAL version equal to upstream's (no CHART_VERSION placeholder), so the tag must be exactly
# that version: hack/release-preflight refuses anything else before a byte is pushed (docs/release.md).
#
# The chart ships its CompositionDefinition (blueprints/<name>/compositiondefinition.yaml, beside blueprints/<name>/chart/) inside
# its archive, so the content is `blueprints` channel content (PUBLISHING.md rule 2).
name: release-tag

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

# A public repository: reading this repository's lint runs needs no actions permission.
permissions:
  contents: read
  packages: write

env:
  # The Marketplace channels this repository publishes to (PUBLISHING.md rule 2: the channel follows from the
  # content). A chart whose content puts it in another channel fails the release before anything is pushed.
  CHANNELS: blueprints

jobs:
  # This repository's own last word before anything is published (PUBLISHING.md rule 12). It runs
  # hack/release-preflight with the tag as $1, at the tag's commit, with no secrets: the tag must be plain X.Y.Z and
  # exactly the version the chart, its appVersion, the upstream dependency and the CompositionDefinition carry.
  # Pinned like the publisher, to the same release (rule 9).
  preflight:
    uses: krateo-blueprints/charts/.github/workflows/release-preflight.yaml@0794359c611fc736f101ecc64d3a86e0ddcad718 # 1.8.0
    with:
      version: ${{ github.ref_name }}

  package-and-push:
    # publish-index needs package-and-push, which needs preflight: a refusal publishes nothing.
    needs:
      - preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Refuse to release a commit no lint run ever passed on (PUBLISHING.md rule 10). A quiet check
      # list reads as success, so the never-triggered case is the one this makes loud.
      - name: The commit being released must have passed lint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="${{ github.sha }}"
          runs="$(gh api \
            "repos/${{ github.repository }}/actions/workflows/lint.yaml/runs?head_sha=${sha}&per_page=100" \
            --jq '[.workflow_runs[] | select(.status == "completed")] | length')"
          ok="$(gh api \
            "repos/${{ github.repository }}/actions/workflows/lint.yaml/runs?head_sha=${sha}&per_page=100" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')"
          echo "lint runs on ${sha}: ${runs} completed, ${ok} successful"
          if [ "${runs}" -eq 0 ]; then
            echo "::error::No lint run exists for ${sha}. Dispatch lint.yaml on this commit, confirm it passes, then re-tag."
            exit 1
          fi
          if [ "${ok}" -eq 0 ]; then
            echo "::error::lint ran on ${sha} but never succeeded. Refusing to publish."
            exit 1
          fi

      # The publish-index job below needs this secret, and it has no fallback (PUBLISHING.md rule 7).
      # Refuse here, before anything is pushed, so a missing token fails the release instead of
      # leaving GHCR holding a version the Marketplace index never receives.
      - name: The Marketplace index token must be present
        env:
          CHARTS_PUBLISH_TOKEN: ${{ secrets.CHARTS_PUBLISH_TOKEN }}
        run: |
          if [ -z "${CHARTS_PUBLISH_TOKEN}" ]; then
            echo "::error::secret CHARTS_PUBLISH_TOKEN is not set, so this release could not reach the"
            echo "::error::Marketplace index. Refusing to push to GHCR alone (krateo-blueprints/charts PUBLISHING.md rule 7)."
            exit 1
          fi
          # The publisher refuses a token carrying whitespace or a control character (typically a
          # trailing newline from piping into `gh secret set`), but only after this job has pushed to
          # GHCR. Refuse it here, by name, before anything is pushed. The token is never printed.
          case "${CHARTS_PUBLISH_TOKEN}" in
            *[[:space:]]*|*[[:cntrl:]]*)
              echo "::error::secret CHARTS_PUBLISH_TOKEN contains whitespace or a control character, usually a trailing newline."
              echo "::error::Re-save it by pasting the token at the prompt of 'gh secret set CHARTS_PUBLISH_TOKEN --org krateo-blueprints --visibility all' (not piped from echo)."
              exit 1 ;;
          esac

      - name: Install Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      - name: Resolve version and registry
        run: |
          echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          echo "OCI_REPO=oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      # The upstream charts this repository builds from must still be the reviewed bytes: every Chart.lock in sync
      # with its Chart.yaml (helm's own digest), and the registry serving each pinned upstream chart at the
      # krateo.io/upstream-digest recorded in Chart.yaml. A tag re-pushed upstream is refused here, before anything is
      # packaged.
      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Upstream dependencies are the pinned bytes
        run: |
          set -euo pipefail
          pip install "PyYAML==6.0.2"
          python3 hack/validate-chart-lock.py . --live

      # Every chart is packaged and checked first, and only then is anything pushed, so a chart the
      # Marketplace index would refuse never reaches GHCR either (PUBLISHING.md rules 1 to 3).
      - name: Package and check every chart
        env:
          # Provenance stamped into every chart (see the loop): the commit and repository that
          # built this version. installer's pin-CI gate reads them to assert THIS repo's CI for a
          # pin, the same org.opencontainers.image.* set the krateo-platformops release-oci
          # reusable stamps.
          GIT_SHA: ${{ github.sha }}
          SRC_URL: ${{ github.server_url }}/${{ github.repository }}
          SRC_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          want_base="oci://ghcr.io/krateo-blueprints/charts"
          mkdir -p pkg dist/blueprints dist/pages dist/operators

          # The CompositionDefinition of each chart, keyed by the chart it installs: the last
          # segment of its spec.chart.url.
          declare -A cd_for=()
          while IFS= read -r -d '' cd; do
            url="$(yq -r 'select(.kind == "CompositionDefinition") | .spec.chart.url' "$cd")"
            url="${url%%$'\n'*}"
            if [ -z "$url" ] || [ "$url" = null ]; then
              echo "::error::${cd} has no CompositionDefinition spec.chart.url"; exit 1
            fi
            target="${url##*/}"
            if [ -n "${cd_for[$target]:-}" ]; then
              echo "::error::${cd_for[$target]} and ${cd} both install ${target}"; exit 1
            fi
            cd_for[$target]="$cd"
          done < <(find . -type f -name compositiondefinition.yaml -not -path '*/charts/*' -not -path './.git/*' -print0)

          while IFS= read -r -d '' cf; do
            dir="$(dirname "$cf")"
            name="$(yq -r '.name' "$cf")"
            echo "::group::${name} (${dir})"
            # Stamp the CHART_VERSION placeholder, and pin the package version to the tag either way.
            sed -i "s/CHART_VERSION/${VERSION}/g" "$cf"
            # Stamp provenance: the commit and repository that built this version. Truthful here
            # because a tag publishes every chart at a NEW version, so a version is only ever built
            # from its own tag's commit (re-running the same tag re-stamps the same commit). Only
            # deterministic values: a timestamp such as image.created would differ on every run.
            yq -i '
              .annotations."org.opencontainers.image.revision" = strenv(GIT_SHA) |
              .annotations."org.opencontainers.image.source"   = strenv(SRC_URL) |
              .annotations."org.opencontainers.image.version"  = strenv(VERSION) |
              .annotations."org.opencontainers.image.ref.name" = strenv(SRC_REF)
            ' "$cf"
            # Dependencies come from the committed Chart.lock: `helm dependency build` refuses a lock out of sync with
            # Chart.yaml and never re-resolves (`update` would rewrite the lock silently). The fetch is retried: a
            # subchart pulled from an upstream repository (here https://seaweedfs.github.io/seaweedfs/helm) can fail
            # transiently. A non-OCI repository must be added first: helm dependency build resolves only repositories
            # the client knows, and refuses the lock otherwise. After three
            # failures the release stops here, before anything is pushed, so a re-run publishes
            # every chart to GHCR and the index together instead of leaving some charts at the
            # new version in GHCR and none of them in the index.
            if grep -q '^dependencies:' "$cf"; then
              yq -r '.dependencies[].repository' "$cf" | grep -E '^https?://' | sort -u | while read -r repo; do
                helm repo add "dep-$(printf '%s' "$repo" | sha256sum | cut -c1-12)" "$repo" >/dev/null
              done
              ok=""
              for attempt in 1 2 3; do
                if helm dependency build "$dir"; then ok=1; break; fi
                echo "::warning::${name}: dependency fetch failed (attempt ${attempt}/3), retrying"
                sleep $((attempt*10))
              done
              if [ -z "$ok" ]; then
                echo "::error::${name}: dependency fetch failed after 3 attempts; nothing was pushed"
                exit 1
              fi
            fi

            # The channel follows from the content (PUBLISHING.md rule 2).
            cd="${cd_for[$name]:-}"
            if [ -n "$cd" ] && [ ! -f "$dir/values.schema.json" ]; then
              echo "::error::${cd} installs ${name}, which has no values.schema.json, so core-provider cannot generate its CRD"
              exit 1
            fi
            if [ -z "$cd" ]; then
              channel=operators
            elif [ "$(yq -r '.annotations."krateo.io/kind" // ""' "$cf")" = page-set ]; then
              channel=pages
            else
              channel=blueprints
            fi
            case " ${CHANNELS} " in
              *" ${channel} "*)
                : ;;
              *)
                echo "::error::${name} is ${channel} content, but this workflow publishes only to: ${CHANNELS}"
                exit 1 ;;
            esac

            if [ "$channel" != operators ]; then
              cd_url="$(yq -r 'select(.kind == "CompositionDefinition") | .spec.chart.url' "$cd")"
              cd_url="${cd_url%%$'\n'*}"
              cd_ver="$(yq -r 'select(.kind == "CompositionDefinition") | .spec.chart.version' "$cd")"
              cd_ver="${cd_ver%%$'\n'*}"
              [ "$cd_url" = "${want_base}/${name}" ] || {
                echo "::error::${cd} installs ${cd_url}, not ${want_base}/${name}"; exit 1; }
              [ "$cd_ver" = "$VERSION" ] || {
                echo "::error::${cd} installs ${name} version '${cd_ver}', not ${VERSION}"; exit 1; }
              # Ship the stamped CompositionDefinition inside the chart, at the root, where helm
              # packages it but never renders it (rule 3). Removed again after packaging, so any
              # later step that looks for CompositionDefinitions finds only the repository's own.
              cp "$cd" "$dir/compositiondefinition.yaml"
            fi

            helm package "$dir" --version "${VERSION}" --destination pkg
            tgz="pkg/${name}-${VERSION}.tgz"
            # Check the package, not the source file: refuse a chart whose packaged Chart.yaml does
            # not carry this commit, so an unstamped version never reaches GHCR or the index.
            stamped="$(tar -xzO -f "$tgz" "${name}/Chart.yaml" \
              | yq -r '.annotations."org.opencontainers.image.revision" // ""')"
            if [ "${stamped}" != "${GIT_SHA}" ]; then
              echo "::error::${name}: packaged chart carries revision '${stamped:-<none>}', expected ${GIT_SHA}; nothing was pushed"
              exit 1
            fi
            echo "provenance: ${tgz} -> ${stamped}"
            packed_chart="$(tar -xzO -f "$tgz" "${name}/Chart.yaml")"

            # Every chart, in every channel, names the repository that builds it (rule 3), so a
            # pinned chart can be traced to the commit and CI run that built it. Matched as the
            # publisher (1.0.3) matches it, never stricter: case-insensitive, trailing slashes
            # ignored, otherwise the whole URL (a /tree/main suffix or a longer name is not it).
            # BEGIN sources-check
            src_url="https://github.com/${GITHUB_REPOSITORY}"
            src_lc="$(tr '[:upper:]' '[:lower:]' <<< "$src_url")"
            srcs="$(yq -r '.sources // [] | .[]' <<< "$packed_chart" | tr '[:upper:]' '[:lower:]' | sed 's#/*$##')"
            grep -qxF "$src_lc" <<< "$srcs" || {
              echo "::error::${name}: Chart.yaml sources: must list ${src_url}, the repository that builds it"; exit 1; }
            # END sources-check

            if [ "$channel" != operators ]; then
              rm "$dir/compositiondefinition.yaml"
              # Check the archive, not the copy: helm package exits 0 whether or not the file made
              # it in. These are the checks the Marketplace publisher makes; failing them here
              # keeps a refused chart out of GHCR too.
              members="$(tar tzf "$tgz")"
              for want in "${name}/compositiondefinition.yaml" "${name}/values.schema.json"; do
                grep -qxF "$want" <<< "$members" || {
                  echo "::error::${tgz} lacks ${want}; refusing to push"; exit 1; }
              done
              packed_cd="$(tar -xzO -f "$tgz" "${name}/compositiondefinition.yaml")"
              packed_url="$(yq -r 'select(.kind == "CompositionDefinition") | .spec.chart.url' <<< "$packed_cd")"
              packed_ver="$(yq -r 'select(.kind == "CompositionDefinition") | .spec.chart.version' <<< "$packed_cd")"
              [ "${packed_url%%$'\n'*}" = "${want_base}/${name}" ] && [ "${packed_ver%%$'\n'*}" = "$VERSION" ] || {
                echo "::error::${tgz}: its CompositionDefinition installs ${packed_url} ${packed_ver}"; exit 1; }
              icon="$(yq -r '.icon // ""' <<< "$packed_chart")"
              case "$icon" in
                https://*)
                  : ;;
                *)
                  echo "::error::${name}: Chart.yaml icon must be an absolute https URL, got '${icon}'"; exit 1 ;;
              esac
              [ "$(yq -r '(.keywords // []) | length' <<< "$packed_chart")" -gt 0 ] || {
                echo "::error::${name}: Chart.yaml needs keywords, the Marketplace's tags"; exit 1; }
            fi

            mv "$tgz" "dist/${channel}/"
            echo "${name} ${VERSION} -> ${channel}"
            unset "cd_for[$name]"
            echo "::endgroup::"
          done < <(find . -type f -name Chart.yaml -not -path '*/charts/*' -not -path './.git/*' -print0)

          if [ "${#cd_for[@]}" -gt 0 ]; then
            echo "::error::CompositionDefinitions install charts this repository does not have: ${!cd_for[*]}"
            exit 1
          fi

      # krateo-blueprints/charts PUBLISHING.md rule 14: charts are pushed through the organisation's chart-push
      # action, whose push.sh retries GHCR's tag read-after-write race (and only that) onto the same digest. Locate
      # mode: it outputs push.sh's path, and the next step runs it once per chart.
      - name: Locate the shared chart push
        id: chart-push
        uses: krateo-platformops/.github/.github/actions/chart-push@e1d3e99215e80ae56eca4a67e9e061b2c73168b8 # 1.0.0

      - name: Push every chart to GHCR
        env:
          CHART_PUSH: ${{ steps.chart-push.outputs.path }}
          # push.sh reads the manifest back with these, after the registry login above.
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ github.token }}
        run: |
          set -euo pipefail
          for tgz in dist/*/*.tgz; do
            bash "${CHART_PUSH}" "$tgz" "${OCI_REPO}"
            echo "Published ${OCI_REPO}/$(basename "$tgz" .tgz)"
          done

      # The same bytes that went to GHCR, for the Marketplace index.
      - name: Hand the blueprint tarballs to the index job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: charts-blueprints
          path: dist/blueprints/*.tgz
          if-no-files-found: error

  # The Marketplace installs what https://krateo-blueprints.github.io/charts/blueprints/index.yaml lists, not what
  # GHCR holds. The organisation's one publisher (krateo-blueprints/charts PUBLISHING.md); it also reads the served
  # index and installs every chart anonymously before it succeeds.
  publish-index:
    needs: package-and-push
    # PUBLISHING.md rule 9: pinned by full commit SHA, the same release as the preflight; .github/dependabot.yml keeps
    # both current.
    uses: krateo-blueprints/charts/.github/workflows/publish-chart.yaml@70095ab05f1c5dc6c8dd39d0b1fdbbc7382a841c # 1.4.3
    with:
      source_repo: ${{ github.repository }}
      git_tag: ${{ github.ref_name }}
      channel: blueprints
      artifact: charts-blueprints
    secrets:
      PUBLISH_TOKEN: ${{ secrets.CHARTS_PUBLISH_TOKEN }}
