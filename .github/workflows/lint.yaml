name: lint

# The gates of this repository. release-tag.yaml refuses a commit with no successful run of this workflow
# (krateo-blueprints/charts PUBLISHING.md rule 10), and a release tags a commit on main, which a pull_request run never
# covers, so it also runs on pushes to main.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # krateo-blueprints/charts PUBLISHING.md rule 9: every reusable workflow this repository calls is pinned by
  # commit SHA with a version comment. The shared check refuses any that is not.
  pinned-uses:
    permissions:
      contents: read
    uses: krateo-blueprints/charts/.github/workflows/pinned-uses.yaml@70095ab05f1c5dc6c8dd39d0b1fdbbc7382a841c # 1.4.3

  lint-docs:
    uses: krateo-platformops/.github/.github/workflows/lint-docs.yaml@4c6aebb6b1ec685ab77d7511ab32277ba0c3baf6 # 1.0.2

  gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # Every gate exits 2 when PyYAML is missing, so a lost install fails the job instead of skipping it.
      - name: Install PyYAML
        run: pip install "PyYAML==6.0.2"

      # Chart.lock in sync with Chart.yaml; helm dependency build accepts it; upstream's repository serves the pinned
      # version with exactly the pinned archive digest.
      - name: The upstream chart is the pinned bytes
        run: python3 hack/validate-chart-lock.py . --live

      # The chart, its dependency, the annotation, the CompositionDefinition and the example name one version.
      - name: Every version names the same upstream release
        run: python3 hack/validate-version-mirror.py .

      # Refused without S3 identities; auth from the input alone; the small footprint; no provider default.
      - name: The chart renders a small, authenticated, provider-agnostic staging store
        run: python3 hack/validate-render.py .

      # The reusable release preflight runs first and gates the push; every uses: is pinned; the hook refuses what it
      # must.
      - name: The release runs this repository's preflight before publishing anything
        run: python3 hack/validate-release-wiring.py .

      # The release's version shape is the shared release-preflight's (charts 1.4.3+, rule 13's exact pattern); this
      # repository's looser check was retired. Fetches the pinned release-preflight.yaml and requires it to refuse
      # what that check refused, and 0.015.0.
      - name: The pinned shared release-preflight refuses every non-plain version
        run: python3 hack/validate-shared-preflight.py .

      - name: Repository-authored YAML is block style only
        run: python3 hack/validate-yaml-block-style.py .

      - name: helm lint the chart
        run: |
          set -euo pipefail
          helm repo add seaweedfs https://seaweedfs.github.io/seaweedfs/helm
          for c in blueprints/*/chart; do
            helm dependency build "$c"
            helm lint "$c" --set seaweedfs.s3.existingConfigSecret=lint-s3-identities
          done
